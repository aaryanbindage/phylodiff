services:
  - type: web
    name: phylodiff
    runtime: node
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    # taxa.db (full NCBI taxonomy) is built once locally with build-db.js and attached to a
    # GitHub release; building it on Render's free tier would run out of memory.
    buildCommand: >-
      curl -fsSL -o taxa.db.gz https://github.com/aaryanbindage/phylodiff/releases/download/data-1/taxa.db.gz &&
      gunzip -f taxa.db.gz
    startCommand: node server.js
    healthCheckPath: /api/stats
